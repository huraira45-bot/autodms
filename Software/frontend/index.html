<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealerDesk</title>

    <!--
      Home-screen app for the service tablets (owner ask 2026-09-23). The
      manifest is scoped to /tablet, so only the tablet screens are offered as
      an app — the desktop ERP is never installed. Over plain HTTP Android
      still reads this for the shortcut's name and icon; a standalone window
      (no address bar) needs HTTPS, and the manifest is ready for that day.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#714b67" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DealerDesk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/tablet-icon-apple-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
